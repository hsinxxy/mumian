<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>木棉班・查詢我的帳</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#2b2a26;--mut:#7a766b;--bd:#e4dfd2;--pri:#2f7d5b;--pt:#fff;--neg:#c0452f;--pos:#2f7d5b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b18;--card:#27261f;--tx:#eeebe0;--mut:#a09b8c;--bd:#3d3b31;--pri:#4fb68a;--pt:#10201a;--neg:#ec7c66;--pos:#4fb68a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:auto;padding:20px 16px}h1{font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{margin-top:12px;background:var(--pri);color:var(--pt);border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;width:100%}
.big{font-size:34px;font-weight:700}.m{color:var(--mut);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}
table{border-collapse:collapse;width:100%}td{padding:7px 4px;border-bottom:1px solid var(--bd);font-size:14px}.r{text-align:right}
</style></head><body><main>
<h1>🪙 查詢我的帳</h1>
<div class="card"><label>座號</label><input id="no" inputmode="numeric"><label>查帳 PIN（老師給的 6 位數）</label><input id="pin" type="password" inputmode="numeric"><button onclick="go()">查詢</button><p class="m" id="msg"></p></div>
<div id="out"></div>
<script>
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co',ANON_KEY='YOUR-ANON-KEY';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),n0=n=>Number(n).toLocaleString('en-US');
async function go(){const no=$('no').value.trim(),pin=$('pin').value.trim();$('out').innerHTML='';
 if(!no||!pin){$('msg').textContent='請輸入座號和 PIN';return}$('msg').textContent='查詢中…';
 try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/student_lookup',{method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_no:no,p_pin:pin})});
  if(!r.ok)throw 0;const j=await r.json();if(!j.length){$('msg').textContent='座號或 PIN 不正確';return}
  const s=j[0];$('msg').textContent='';
  $('out').innerHTML=`<div class="card"><div class="m">${esc(no)} 號　${esc(s.name)}　${esc(s.dept)}</div><div class="big">${n0(s.balance)} 元</div><div class="m">更新時間：${esc(new Date(s.updated).toLocaleString('zh-TW'))}</div></div><div class="card"><b>最近紀錄</b><table>${(s.entries||[]).map(e=>`<tr><td>${esc(e.d)}</td><td>${esc(e.l)}</td><td class="r ${e.a<0?'neg':'pos'}">${e.a>0?'+':''}${e.a}</td><td class="r m">${n0(e.b)}</td></tr>`).join('')||'<tr><td class="m">還沒有紀錄</td></tr>'}</table></div>`}
 catch(e){$('msg').textContent='查詢失敗，請稍後再試'}}
</script></main></body></html>
